<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>imcui — matcher usage</title>
    <script src="https://cdn.plot.ly/plotly-4.1.1.min.js" charset="utf-8"></script>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
        --line: #d1d9e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6edf3;
          --muted: #9198a1;
          --bg: #0d1117;
          --line: #30363d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        max-width: 1100px;
        padding: 40px 20px 80px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        margin: 40px 0 12px;
      }
      p {
        margin: 4px 0;
      }
      a {
        color: inherit;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .error {
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #cf222e;
        white-space: pre-wrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>imcui — matcher usage</h1>
    <p class="muted">
      Anonymous count of completed runs per matcher in the
      <a href="https://huggingface.co/spaces/Realcat/image-matching-webui"
        >public Hugging Face Space</a
      >. Only the matcher key is recorded — no images, IPs, or user identifiers.
    </p>
    <p class="muted" id="meta"></p>

    <div class="error" id="error" hidden></div>

    <h2>Runs per day</h2>
    <div id="daily"></div>

    <h2>Total runs</h2>
    <div id="totals"></div>

    <h2>Breakdown</h2>
    <div id="table"></div>

    <script src="stats.js"></script>
  </body>
</html>
